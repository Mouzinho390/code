<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[{"id":"presenter","type":"string","label":"Presenter footage","default":"assets/presenter.mp4"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ink: #14161c;
        --font-ui: "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0e0e12;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--font-ui);
      }
      /* Presenter camera: the wrapper moves (split / face), the video inside is timed. */
      #cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        z-index: 1;
      }
      #cam-video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      /* The airy animation panel: clip-path decides split / full / hidden. */
      #panel {
        position: absolute;
        inset: 0;
        z-index: 2;
        overflow: hidden;
        background: linear-gradient(180deg, #f7f9fc 0%, #e6f0fb 55%, #d9e9fa 100%);
        clip-path: inset(0% 0% 50% 0%);
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.75;
      }
      #blob-a {
        width: 620px;
        height: 620px;
        left: 620px;
        top: -160px;
        background: #ffe3cf;
      }
      #blob-b {
        width: 700px;
        height: 700px;
        left: -260px;
        top: 900px;
        background: #cfe4ff;
      }
      #blob-c {
        width: 520px;
        height: 520px;
        left: 420px;
        top: 1400px;
        background: #fff1dc;
      }
      .scene {
        z-index: 3;
      }
      #captions {
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="21"
      data-width="1080"
      data-height="1920"
    >
      <div id="cam">
        <video
          id="cam-video"
          class="clip"
          src="assets/presenter.mp4"
          data-var-src="presenter"
          data-start="0"
          data-duration="21"
          data-track-index="0"
          muted
          playsinline
        ></video>
      </div>

      <div id="panel" data-layout-ignore>
        <div id="blob-a" class="blob"></div>
        <div id="blob-b" class="blob"></div>
        <div id="blob-c" class="blob"></div>
      </div>

      <div id="sc-record" class="scene" data-composition-id="sc-record" data-composition-src="compositions/sc-record.html" data-start="0" data-duration="2.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="sc-hours" class="scene" data-composition-id="sc-hours" data-composition-src="compositions/sc-hours.html" data-start="2.4" data-duration="1.95" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="sc-style" class="scene" data-composition-id="sc-style" data-composition-src="compositions/sc-style.html" data-start="6.1" data-duration="1.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="sc-agent" class="scene" data-composition-id="sc-agent" data-composition-src="compositions/sc-agent.html" data-start="7.6" data-duration="4.05" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="sc-words" class="scene" data-composition-id="sc-words" data-composition-src="compositions/sc-words.html" data-start="11.65" data-duration="1.9" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="sc-cards" class="scene" data-composition-id="sc-cards" data-composition-src="compositions/sc-cards.html" data-start="13.55" data-duration="2.05" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="sc-post" class="scene" data-composition-id="sc-post" data-composition-src="compositions/sc-post.html" data-start="15.6" data-duration="2.3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="sc-stats" class="scene" data-composition-id="sc-stats" data-composition-src="compositions/sc-stats.html" data-start="17.9" data-duration="1.85" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="21" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <audio id="voice" class="clip" src="assets/voice.wav" data-start="0" data-duration="21" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Layout modes. split: panel on top half, face below. full: panel fills the frame.
      // face: panel gone, camera fills the frame with a slow push-in.
      const SPLIT = "inset(0% 0% 50% 0%)";
      const FULL = "inset(0% 0% 0% 0%)";
      const GONE = "inset(0% 0% 100% 0%)";
      const PAN = { duration: 0.45, ease: "power3.inOut" };

      tl.set("#panel", { clipPath: SPLIT }, 0);
      tl.set("#cam", { y: 480, scale: 1, transformOrigin: "50% 40%" }, 0);

      // Drifting pastel light inside the panel.
      tl.fromTo("#blob-a", { x: 0, y: 0 }, { x: -140, y: 120, duration: 21, ease: "sine.inOut" }, 0);
      tl.fromTo("#blob-b", { x: 0, y: 0 }, { x: 180, y: -160, duration: 21, ease: "sine.inOut" }, 0);
      tl.fromTo("#blob-c", { x: 0, y: 0 }, { x: -120, y: -220, duration: 21, ease: "sine.inOut" }, 0);

      // 4.35 cut to face
      tl.set("#panel", { clipPath: GONE }, 4.35);
      tl.set("#cam", { y: 0, scale: 1.04 }, 4.35);
      tl.to("#cam", { scale: 1.1, duration: 1.75, ease: "none" }, 4.35);
      // 6.10 cut back to split
      tl.set("#panel", { clipPath: SPLIT }, 6.1);
      tl.set("#cam", { y: 480, scale: 1 }, 6.1);
      // 7.60 pan to full screen
      tl.to("#panel", { clipPath: FULL, ...PAN }, 7.42);
      // 11.65 back to split
      tl.to("#panel", { clipPath: SPLIT, ...PAN }, 11.5);
      // 13.55 full again through 17.9
      tl.to("#panel", { clipPath: FULL, ...PAN }, 13.4);
      tl.to("#panel", { clipPath: SPLIT, ...PAN }, 17.75);
      // 19.75 cut to face for the sign-off
      tl.set("#panel", { clipPath: GONE }, 19.75);
      tl.set("#cam", { y: 0, scale: 1.05 }, 19.75);
      tl.to("#cam", { scale: 1.12, duration: 1.25, ease: "power1.out" }, 19.75);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
